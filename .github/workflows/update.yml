name: Update tracker data

on:
  schedule:
    # 09:17 UTC daily. Deliberately off the hour — GitHub's cron scheduler is
    # congested at :00 and runs there are often delayed or dropped.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild tracker.json
        run: node build.js
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      # EIA publishes daily spot prices with a few business days' lag, so most
      # runs find nothing new; build.js leaves the file untouched in that case
      # and this step commits nothing.
      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- docs/tracker.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tracker.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracker.json
          git commit -m "Update tracker data ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Publishes docs/ to GitHub Pages through the Actions deployment path
  # (Pages "Source" must be set to "GitHub Actions"). We deploy from our own
  # workflow because pushes made with the built-in workflow token do not
  # trigger the branch-based Pages pipeline.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # the update job may have just pushed a new commit — deploy that,
          # not the commit that triggered this run
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
